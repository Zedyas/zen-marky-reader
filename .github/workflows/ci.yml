name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build-app.sh
